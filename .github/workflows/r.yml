name: R-CMD-check

# Every pull request runs this, into dev as well as main. Pushes do not: a
# branch is checked when it is proposed, and the same commits do not need
# checking twice. See CONTRIBUTING.md.
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: R-CMD-check (${{ matrix.config.os }}, ${{ matrix.config.r }})
    strategy:
      fail-fast: false
      # CRAN checks against r-devel, r-release, and r-oldrel, so the matrix
      # covers all three. oldrel runs on ubuntu; release runs everywhere,
      # because it is what most users are on.
      #
      # devel runs on ubuntu and on windows. Windows plus r-devel is the pair
      # CRAN's own incoming check runs, and r-lib's standard matrix leaves it
      # out, so it was the one combination nothing here covered. Running it
      # means a submission does not depend on remembering to send the tarball
      # to win-builder by hand.
      matrix:
        config:
          - { os: ubuntu-latest, r: "devel", http-user-agent: "release" }
          - { os: ubuntu-latest, r: "release" }
          - { os: ubuntu-latest, r: "oldrel-1" }
          - { os: windows-latest, r: "devel" }
          - { os: windows-latest, r: "release" }
          - { os: macos-latest, r: "release" }
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

  lint-r:
    runs-on: ubuntu-latest
    name: lint-r
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, local::.
          needs: lint

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true
