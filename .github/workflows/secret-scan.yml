name: secret-scan

# Every pull request runs this, into dev as well as main. gitleaks also runs
# locally on every commit through prek, which catches a credential before it
# becomes a commit, but that only helps someone who installed the hooks. This
# is the check that does not depend on the contributor's setup.
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for secrets with gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
