name: pkgdown

# Only a pull request into main runs this. Build the site locally with
# `pkgdown::build_site(preview = FALSE)` while working. See CONTRIBUTING.md.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build only. Publishing the site to Pages waits for Phase 3, when the repo
  # goes public and lands on r-universe.
  build:
    runs-on: ubuntu-latest
    name: build
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build pkgdown site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          if-no-files-found: error
