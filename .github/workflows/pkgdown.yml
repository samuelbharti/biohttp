name: pkgdown

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build only. Publishing the site to Pages waits for Phase 3, when the repo
  # goes public and lands on r-universe.
  build:
    runs-on: ubuntu-latest
    name: build
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # dest_dir has to be passed explicitly. build_site_github_pages() defaults
      # it to "docs", and that default overrides the destination set in
      # _pkgdown.yml, so the site was being written somewhere the upload step
      # was not looking. docs/ is also where the working notes live locally,
      # which is why the site was given its own directory in the first place.
      - name: Build pkgdown site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE, dest_dir = "_site")
        shell: Rscript {0}

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          if-no-files-found: error
